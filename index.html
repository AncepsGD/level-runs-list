<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Level Runs List</title>
    <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png?v=20261015" sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg?v=20261015">
    <link rel="shortcut icon" href="/favicon/favicon.ico?v=20261015">
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png?v=20261015">
    <meta name="apple-mobile-web-app-title" content="LRL">
    <link rel="manifest" href="/favicon/site.webmanifest?v=20261015">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="w">
        <header>
            <h1><img class="site-icon" src="/favicon/favicon-96x96.png?v=20261015" alt="" aria-hidden="true">
                Level <span class="accent-purple">Runs</span> <span class="accent-green">List</span></h1>
            <p class="site-maintenance">Maintained by Anceps & more since January 1, 2026.</p>
        </header>
        <nav class="page-nav" aria-label="Main navigation">
            <button class="page-nav-link active" type="button" data-view="main" aria-current="page"><i
                    class="fa-solid fa-list-ol" aria-hidden="true"></i> Main List</button>
            <button class="page-nav-link" type="button" data-view="uncompleted"><i class="fa-solid fa-list-check"
                    aria-hidden="true"></i> Uncompleted</button>
            <button class="page-nav-link" type="button" data-view="leaderboards"><i class="fa-solid fa-ranking-star"
                    aria-hidden="true"></i> Leaderboard</button>
            <a class="page-nav-link" href="https://discord.gg/r4c3DmEk6N" target="_blank"
                rel="noopener noreferrer"><i class="fa-brands fa-discord" aria-hidden="true"></i> Discord</a>
        </nav>
        <div class="bw">
            <div class="bar">
                <input id="q" type="search" placeholder="Search level, ID or player">
                <div class="sort-control" id="sort-control">
                    <select id="s">
                        <option value="rank">Sort: Rank</option>
                        <option value="most">Sort: Most runs</option>
                        <option value="fewest">Sort: Fewest relevant runs</option>
                    </select>
                </div>
            </div>
        </div>
        <main id="list"></main>
    </div>
    <div id="video-modal" class="video-modal" hidden>
        <div class="video-modal-backdrop" data-close-video-modal></div>
        <div class="video-modal-shell" role="dialog" aria-modal="true" aria-label="Video player">
            <button class="video-modal-close" type="button" aria-label="Close video player"
                data-close-video-modal>✕</button>
            <div class="video-modal-frame-wrap">
                <iframe id="video-modal-iframe" class="video-modal-frame" title="Embedded video"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    allowfullscreen></iframe>
            </div>
        </div>
    </div>
    <script src="video-player.js"></script>
    <script src="level-data.js"></script>
    <script src="run-helpers.js"></script>
    <script src="leaderboard.js"></script>
    <script src="script.js"></script>
</body>

</html>
